services:
  echo-backend:
    image: ealen/echo-server:latest
    ports:
      - "8081:80"
    environment:
      - PORT=80
    restart: unless-stopped

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    depends_on:
      - echo-backend
